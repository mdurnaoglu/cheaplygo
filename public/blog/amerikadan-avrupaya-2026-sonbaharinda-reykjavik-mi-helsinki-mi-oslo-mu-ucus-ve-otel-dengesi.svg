    <text x="1090" y="616" fill="#35515A" font-size="21" font-family="Arial, sans-serif">Airport transfer, first hotel, and</text>
    <text x="1090" y="650" fill="#35515A" font-size="21" font-family="Arial, sans-serif">day-one energy matter more.</text>
