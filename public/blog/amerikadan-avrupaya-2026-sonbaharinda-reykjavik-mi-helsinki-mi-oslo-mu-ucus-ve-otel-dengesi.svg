    <text x="379" y="292" fill="#FFF7F1" font-size="23" font-family="Arial, sans-serif" font-weight="700">Hotel Logic</text>
    <text x="146" y="350" fill="#203542" font-size="24" font-family="Arial, sans-serif">Compare first-night friction, airport flow, and usable trip rhythm.</text>
  </g>

