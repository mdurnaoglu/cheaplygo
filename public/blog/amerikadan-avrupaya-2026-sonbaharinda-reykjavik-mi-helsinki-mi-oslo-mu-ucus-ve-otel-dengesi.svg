    <text x="428" y="592" fill="#5E4110" font-size="28" font-family="Georgia, serif" font-weight="700">Helsinki</text>
    <text x="425" y="626" fill="#694D1F" font-size="18" font-family="Arial, sans-serif">Easy arrival flow</text>
    <rect x="576" y="546" width="154" height="114" rx="22" fill="#7C9AA4"/>
    <text x="621" y="592" fill="#F7FBFC" font-size="28" font-family="Georgia, serif" font-weight="700">Oslo</text>
    <text x="603" y="626" fill="#E6F0F2" font-size="18" font-family="Arial, sans-serif">Balanced city rhythm</text>
  </g>

