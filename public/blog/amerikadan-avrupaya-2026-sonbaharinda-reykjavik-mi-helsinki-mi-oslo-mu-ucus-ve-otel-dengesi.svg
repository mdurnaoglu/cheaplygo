    <text x="1002" y="258" fill="#7B4B30" font-size="22" font-family="Arial, sans-serif">Helsinki: low-friction first Europe trip</text>
    <text x="1002" y="296" fill="#7B4B30" font-size="22" font-family="Arial, sans-serif">Oslo: balanced city + outdoor rhythm</text>
